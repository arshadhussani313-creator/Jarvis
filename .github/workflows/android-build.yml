# Builds the debug APK on a GitHub-hosted runner. Use this if you cannot build on
# your PC. Push the project to GitHub, then download the APK from the run's
# Artifacts section. This workflow has not been run in this environment.
name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
